type Theme = 'dark' | 'light';

type ThemeCtx = {
  theme: Theme;
  toggle: () => void;
};

const Ctx = createContext<ThemeCtx>({ theme: 'dark', toggle: () => {} });

function useTheme() {
  return useContext(Ctx);
}

function ThemeProvider({ children }: { children: ReactNode }) {
  const [theme, setTheme] = useState<Theme>('dark');

  useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
  }, [theme]);

  const toggle = () => setTheme((t) => (t === 'dark' ? 'light' : 'dark'));

  return <Ctx.Provider value={{ theme, toggle }}>{children}</Ctx.Provider>;
}

type AnimationFrame = (ctx: CanvasRenderingContext2D, t: number, width: number, height: number) => void;

/**
 * Sets up a requestAnimationFrame loop on a canvas, handling DPR scaling and resize.
 * The draw callback receives a time value in seconds and the CSS pixel dimensions.
 */
function useCanvasAnimation(draw: AnimationFrame, deps: React.DependencyList = []) {
  const canvasRef = useRef<HTMLCanvasElement>(null);
  const drawRef = useRef(draw);
  drawRef.current = draw;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let raf = 0;
    let start = performance.now();

    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);

    const loop = (now: number) => {
      const t = (now - start) / 1000;
      const rect = canvas.getBoundingClientRect();
      drawRef.current(ctx, t, rect.width, rect.height);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, deps);

  return canvasRef;
}

            'rgba(250,204,21,0.35)',

        }}
      />

      {corners.map((color, i) => {
        const s = seeds[i];

          ['100%', '0%'],
          ['100%', '100%'],

        return (
          <div

/**
 * Idle background effect: floating sine waves and rotating unit-circle
 * ghosts drift across the screen behind everything else. Subtle and slow.
 */
function IdleBackground() {
  const canvasRef = useRef<HTMLCanvasElement>(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let raf = 0;
    let start = performance.now();

    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);

    // Pre-generate floating wave configs
    const waves = Array.from({ length: 5 }, (_, i) => ({
      amp: 30 + i * 20,
      freq: 0.005 + i * 0.002,
      speed: 0.3 + i * 0.15,
      yOff: 0.2 + i * 0.15,
      hue: 190 + i * 30,
      phase: i * 1.3,
    }));

    const circles = Array.from({ length: 4 }, (_, i) => ({
      x: 0.15 + i * 0.25,
      y: 0.3 + (i % 2) * 0.4,
      r: 40 + i * 25,
      speed: 0.2 + i * 0.1,
      hue: 200 + i * 40,
    }));

    const loop = (now: number) => {
      const t = (now - start) / 1000;
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      // Floating sine waves
      for (const wave of waves) {
        ctx.strokeStyle = `hsla(${wave.hue}, 70%, 60%, 0.06)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 3) {
          const y = h * wave.yOff + wave.amp * Math.sin(wave.freq * x + t * wave.speed + wave.phase);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Rotating unit-circle ghosts
      for (const c of circles) {
        const cx = w * c.x + Math.sin(t * c.speed * 0.5) * 30;
        const cy = h * c.y + Math.cos(t * c.speed * 0.5) * 20;
        const rot = t * c.speed;

        ctx.strokeStyle = `hsla(${c.hue}, 70%, 60%, 0.05)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, c.r, 0, Math.PI * 2);
        ctx.stroke();

        // radius line
        const px = cx + c.r * Math.cos(rot);
        const py = cy + c.r * Math.sin(rot);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(px, py);
        ctx.stroke();

        // dot
        ctx.fillStyle = `hsla(${c.hue}, 70%, 60%, 0.08)`;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      className="pointer-events-none fixed inset-0 -z-[5]"
    />
  );
}


type Pt = { x: number; y: number };

/**
 * Trigonometric cursor tracer: a unit circle follows the mouse with
 * a rotating radius vector, sin/cos projections, and a trailing
 * sine-wave ribbon. Pure canvas, screen blend mode.
 */
function CursorTracer() {
  const canvasRef = useRef<HTMLCanvasElement>(null);
  const mouseRef = useRef<Pt>({ x: -100, y: -100 });
  const trailRef = useRef<Pt[]>([]);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    let raf = 0;
    let start = performance.now();

    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);

    const onMove = (e: MouseEvent) => {
      mouseRef.current = { x: e.clientX, y: e.clientY };
    };
    window.addEventListener('mousemove', onMove);

    const loop = (now: number) => {
      const t = (now - start) / 1000;
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      const m = mouseRef.current;
      trailRef.current.push({ x: m.x, y: m.y });
      if (trailRef.current.length > 35) trailRef.current.shift();

      const trail = trailRef.current;

      // --- Trailing sine-wave ribbon ---
      for (let i = 0; i < trail.length - 1; i++) {
        const p = trail[i];
        const next = trail[i + 1];
        const age = (trail.length - i) / trail.length;
        const ang = Math.atan2(next.y - p.y, next.x - p.x);
        const perp = ang + Math.PI / 2;
        const wave = Math.sin(t * 4 + i * 0.5) * 10 * age;
        const offX = Math.cos(perp) * wave;
        const offY = Math.sin(perp) * wave;

        const hue = (i * 10 + t * 40) % 360;
        const alpha = age * 0.4;
        ctx.strokeStyle = `hsla(${hue}, 85%, 65%, ${alpha})`;
        ctx.lineWidth = 2 * age;
        ctx.beginPath();
        ctx.moveTo(p.x + offX, p.y + offY);
        ctx.lineTo(next.x + offX, next.y + offY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(p.x - offX, p.y - offY);
        ctx.lineTo(next.x - offX, next.y - offY);
        ctx.stroke();
      }

      // --- Unit circle at cursor ---
      if (m.x > -50) {
        const R = 28;
        const cx = m.x;
        const cy = m.y;
        const angle = t * 1.5;
        const px = cx + R * Math.cos(angle);
        const py = cy + R * Math.sin(angle);

        // Glow behind circle
        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.8);
        glow.addColorStop(0, 'rgba(56,189,248,0.25)');
        glow.addColorStop(0.5, 'rgba(244,114,182,0.12)');
        glow.addColorStop(1, 'rgba(56,189,248,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Circle outline
        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.stroke();

        // Axes
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - R - 6, cy);
        ctx.lineTo(cx + R + 6, cy);
        ctx.moveTo(cx, cy - R - 6);
        ctx.lineTo(cx, cy + R + 6);
        ctx.stroke();

        // Angle arc
        ctx.strokeStyle = 'rgba(244,114,182,0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, angle);
        ctx.stroke();

        // Radius vector
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(px, py);
        ctx.stroke();

        // cos projection (horizontal, cyan)
        ctx.strokeStyle = 'rgba(56,189,248,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px, cy);
        ctx.stroke();

        // sin projection (vertical, pink)
        ctx.strokeStyle = 'rgba(244,114,182,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px, cy);
        ctx.lineTo(cx, cy);
        ctx.stroke();

        // Point on circle
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Center dot
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.arc(cx, cy, 2, 0, Math.PI * 2);
        ctx.fill();

        // Pulsing outer ring
        const pulseR = R + 6 + Math.sin(t * 2.5) * 4;
        ctx.strokeStyle = `rgba(56,189,248,${0.15 + Math.sin(t * 2.5) * 0.08})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, pulseR, 0, Math.PI * 2);
        ctx.stroke();
      }

      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      className="pointer-events-none fixed inset-0 z-[100]"
      style={{ mixBlendMode: 'screen' }}
    />
  );
}

      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const cx = w * 0.22;
      const cy = h / 2;
      const baseR = Math.min(w, h) * 0.12;

      // Draw epicycles
      let x = cx;
      let y = cy;
      const harmonics = 5;
      for (let k = 1; k <= harmonics; k++) {
        const n = 2 * k - 1;
        const r = (baseR * 4) / (n * Math.PI);
        const ang = n * time * 0.6;
        const x2 = x + r * Math.cos(ang);
        const y2 = y + r * Math.sin(ang);

        ctx.strokeStyle = `rgba(56,189,248,${0.15 / k})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = `rgba(244,114,182,${0.4 / k})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        x = x2;
        y = y2;
      }

      // Connector to wave
      const waveX = w * 0.38;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(waveX, y);
      ctx.stroke();

      // Draw the square wave being built
      ctx.strokeStyle = 'rgba(251,191,36,0.7)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      const samples = 180;
      for (let i = 0; i <= samples; i++) {
        const u = i / samples;
        const px = waveX + u * (w - waveX - 20);
        let sum = 0;
        for (let k = 1; k <= harmonics; k++) {
          const n = 2 * k - 1;
          sum += (4 / (n * Math.PI)) * Math.sin(n * (u * 4 * Math.PI - time * 1.2));
        }
        const py = cy + sum * baseR;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Glowing tip
      const grad = ctx.createRadialGradient(x, y, 0, x, y, 12);
      grad.addColorStop(0, '#fbbf24');
      grad.addColorStop(1, 'rgba(251,191,36,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.fill();

      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
    };
  }, []);

  const icons = [Atom, Waves, Radio, Cog, Sun];

  return (
    <div className={`relative min-h-screen w-full overflow-hidden transition-opacity duration-700 ${mounted ? 'opacity-100' : 'opacity-0'}`}>
      {/* Hero canvas */}
      <canvas
        ref={canvasRef}
        className="absolute inset-0 h-full w-full"
        style={{ opacity: 0.5 }}
      />

      {/* Content */}
      <div className="relative z-10 flex min-h-screen flex-col items-center justify-center px-6 text-center">
        {/* Badge */}
        <div
          className="mb-6 flex items-center gap-2 rounded-full border border-cyan-400/20 bg-cyan-400/5 px-4 py-1.5 backdrop-blur-md transition-all duration-500"
          style={{ animation: 'fadeDown 0.6s ease-out 0.1s both' }}
        >

function UnitCircleSlide() {
  const [angle, setAngle] = useState(45);
  const [playing, setPlaying] = useState(true);
  const stateRef = useRef({ angle: 45, playing: true });
  stateRef.current = { angle, playing };

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const cx = w / 2;
    const cy = h / 2;
    const R = Math.min(w, h) * 0.32;

    let a = stateRef.current.angle;
    if (stateRef.current.playing) {
      a = (t * 40) % 360;
      setAngle(a);
    }
    const rad = (a * Math.PI) / 180;
    const px = cx + R * Math.cos(rad);
    const py = cy - R * Math.sin(rad);

    ctx.clearRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, cy); ctx.lineTo(w, cy);
    ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(56,189,248,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(244,114,182,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, -rad, true);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(px, py);
    ctx.stroke();

    ctx.strokeStyle = '#f472b6';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(px, py); ctx.lineTo(px, cy);
    ctx.stroke();

    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(px, cy); ctx.lineTo(cx, cy);
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = '13px ui-sans-serif, system-ui';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText(`cos θ = ${Math.cos(rad).toFixed(3)}`, cx + R * 0.35, cy + 18);
    ctx.fillStyle = '#f472b6';
    ctx.fillText(`sin θ = ${Math.sin(rad).toFixed(3)}`, px + 8, py - 8);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(`θ = ${a.toFixed(0)}°`, cx + 6, cy - 8);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-3 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <button
          onClick={() => setPlaying(!playing)}
          className="text-xs font-semibold text-white/80 hover:text-white"
        >
          {playing ? 'Pause' : 'Play'}
        </button>
        <input
          type="range"
          min={0}
          max={360}
          value={angle}
          onChange={(e) => { setPlaying(false); setAngle(+e.target.value); }}
          className="h-1 w-40 cursor-pointer appearance-none rounded-full bg-white/20 accent-cyan-400"
        />
      </div>
    </div>
  );
}


function WaveSuperpositionSlide() {
  const [f1, setF1] = useState(1.0);
  const [f2, setF2] = useState(1.1);
  const ref = useRef({ f1, f2 });
  ref.current = { f1, f2 };

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const { f1, f2 } = ref.current;
    const mid = h / 2;
    const amp = h * 0.14;
    ctx.clearRect(0, 0, w, h);

    const drawWave = (fn: (x: number) => number, color: string, width: number, alpha: number) => {
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = width;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 2) {
        const u = x / w;
        const y = mid + fn(u);
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    };

    // midline
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();

    drawWave((u) => amp * Math.sin(2 * Math.PI * (f1 * u - t * 0.3)), '#f472b6', 2, 0.55);
    drawWave((u) => amp * 0.8 * Math.sin(2 * Math.PI * (f2 * u - t * 0.3)), '#38bdf8', 2, 0.55);

    // sum
    drawWave(
      (u) =>
        amp * Math.sin(2 * Math.PI * (f1 * u - t * 0.3)) +
        amp * 0.8 * Math.sin(2 * Math.PI * (f2 * u - t * 0.3)),
      '#fbbf24', 3, 1,
    );

    // labels
    ctx.font = '12px ui-sans-serif, system-ui';
    ctx.fillStyle = '#f472b6'; ctx.fillText('Wave 1', 12, 20);
    ctx.fillStyle = '#38bdf8'; ctx.fillText('Wave 2', 12, 36);
    ctx.fillStyle = '#fbbf24'; ctx.fillText('Combined', 12, 52);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-4 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <label className="flex items-center gap-2 text-xs text-pink-300">
          f₁
          <input type="range" min={0.5} max={3} step={0.05} value={f1}
            onChange={(e) => setF1(+e.target.value)}
            className="h-1 w-24 cursor-pointer appearance-none rounded-full bg-white/20 accent-pink-400" />
        </label>
        <label className="flex items-center gap-2 text-xs text-cyan-300">
          f₂
          <input type="range" min={0.5} max={3} step={0.05} value={f2}
            onChange={(e) => setF2(+e.target.value)}
            className="h-1 w-24 cursor-pointer appearance-none rounded-full bg-white/20 accent-cyan-400" />
        </label>
      </div>
    </div>
  );
}


function FourierSlide() {
  const [harmonics, setHarmonics] = useState(8);
  const ref = useRef(harmonics);
  ref.current = harmonics;

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const N = ref.current;
    const cx = w * 0.28;
    const cy = h / 2;
    const baseR = Math.min(w, h) * 0.13;
    ctx.clearRect(0, 0, w, h);

    // Build square wave via epicycles
    let x = cx;
    let y = cy;
    const trail: [number, number][] = [];

    for (let k = 1; k <= N; k++) {
      const n = 2 * k - 1;
      const r = (baseR * 4) / (n * Math.PI);
      const ang = n * t * 0.8;
      const x2 = x + r * Math.cos(ang);
      const y2 = y + r * Math.sin(ang);

      ctx.strokeStyle = 'rgba(251,191,36,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = 'rgba(251,191,36,0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();

      x = x2; y = y2;
    }

    // connector to wave
    const waveX = w * 0.42;
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(waveX, y); ctx.stroke();

    // draw square wave trace
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const samples = 200;
    for (let i = 0; i <= samples; i++) {
      const u = i / samples;
      const px = waveX + u * (w - waveX - 10);
      let sum = 0;
      for (let k = 1; k <= N; k++) {
        const n = 2 * k - 1;
        sum += (4 / (n * Math.PI)) * Math.sin(n * (u * 2 * Math.PI * 2 - t * 1.6));
      }
      const py = cy + sum * baseR;
      trail.push([px, py]);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // moving dot at the wave front aligned with epicycles
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(waveX, y, 4, 0, Math.PI * 2); ctx.fill();

    ctx.font = '12px ui-sans-serif, system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`${N} harmonics`, 12, 20);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-3 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <span className="text-xs font-semibold text-amber-300">Harmonics</span>
        <input type="range" min={1} max={25} value={harmonics}
          onChange={(e) => setHarmonics(+e.target.value)}
          className="h-1 w-40 cursor-pointer appearance-none rounded-full bg-white/20 accent-amber-400" />
        <span className="w-6 text-xs text-white/70">{harmonics}</span>
      </div>
    </div>
  );
}


function PendulumSlide() {
  const [length, setLength] = useState(0.5);
  const [gravity, setGravity] = useState(9.81);
  const ref = useRef({ length, gravity });
  ref.current = { length, gravity };

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const { length: L, gravity: g } = ref.current;
    const pivotX = w / 2;
    const pivotY = h * 0.12;
    const maxLen = h * 0.6;
    const len = maxLen * L;
    const omega = Math.sqrt(g / (L * 1.5)) * 1.2;
    const theta = 0.6 * Math.cos(omega * t);
    const bobX = pivotX + len * Math.sin(theta);
    const bobY = pivotY + len * Math.cos(theta);

    ctx.clearRect(0, 0, w, h);

    // arc trail
    ctx.strokeStyle = 'rgba(52,211,153,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, len, Math.PI / 2 - 0.6, Math.PI / 2 + 0.6);
    ctx.stroke();
    ctx.setLineDash([]);

    // rod
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(pivotX, pivotY); ctx.lineTo(bobX, bobY); ctx.stroke();

    // pivot
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(pivotX, pivotY, 4, 0, Math.PI * 2); ctx.fill();

    // bob with glow
    const grad = ctx.createRadialGradient(bobX, bobY, 2, bobX, bobY, 26);
    grad.addColorStop(0, '#34d399');
    grad.addColorStop(1, 'rgba(52,211,153,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(bobX, bobY, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#34d399';
    ctx.beginPath(); ctx.arc(bobX, bobY, 12, 0, Math.PI * 2); ctx.fill();

    // angle arc
    ctx.strokeStyle = 'rgba(251,191,36,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(pivotX, pivotY, 30, Math.PI / 2, Math.PI / 2 + theta, theta < 0);
    ctx.stroke();

    // period readout
    const period = 2 * Math.PI * Math.sqrt((L * 1.5) / g);
    ctx.font = '13px ui-sans-serif, system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`T = 2π√(L/g) = ${period.toFixed(2)} s`, 12, 24);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(`θ = ${(theta * 180 / Math.PI).toFixed(1)}°`, 12, 42);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-4 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <label className="flex items-center gap-2 text-xs text-emerald-300">
          Length
          <input type="range" min={0.2} max={1} step={0.05} value={length}
            onChange={(e) => setLength(+e.target.value)}
            className="h-1 w-24 cursor-pointer appearance-none rounded-full bg-white/20 accent-emerald-400" />
        </label>
        <label className="flex items-center gap-2 text-xs text-amber-300">
          Gravity
          <input type="range" min={1.6} max={25} step={0.1} value={gravity}
            onChange={(e) => setGravity(+e.target.value)}
            className="h-1 w-24 cursor-pointer appearance-none rounded-full bg-white/20 accent-amber-400" />
        </label>
      </div>
    </div>
  );
}


function LissajousSlide() {
  const [a, setA] = useState(3);
  const [b, setB] = useState(2);
  const [phase, setPhase] = useState(90);
  const ref = useRef({ a, b, phase });
  ref.current = { a, b, phase };

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const { a, b, phase } = ref.current;
    const cx = w / 2;
    const cy = h / 2;
    const R = Math.min(w, h) * 0.36;
    const d = (phase * Math.PI) / 180;
    ctx.clearRect(0, 0, w, h);

    // trail
    ctx.strokeStyle = 'rgba(167,139,250,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const segs = 600;
    for (let i = 0; i <= segs; i++) {
      const u = (i / segs) * Math.PI * 2;
      const x = cx + R * Math.sin(a * u + d);
      const y = cy + R * Math.sin(b * u);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // animated moving dot
    const u = (t * 0.6) % (Math.PI * 2);
    const x = cx + R * Math.sin(a * u + d);
    const y = cy + R * Math.sin(b * u);

    // glow
    const grad = ctx.createRadialGradient(x, y, 1, x, y, 20);
    grad.addColorStop(0, '#a78bfa');
    grad.addColorStop(1, 'rgba(167,139,250,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();

    // partial trail behind dot
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    const tail = 80;
    for (let i = 0; i <= tail; i++) {
      const uu = u - (i / tail) * 0.5;
      const px = cx + R * Math.sin(a * uu + d);
      const py = cy + R * Math.sin(b * uu);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.font = '13px ui-sans-serif, system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`a:${a}  b:${b}  δ:${phase}°`, 12, 20);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-3 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <label className="flex items-center gap-1 text-xs text-violet-300">a
          <input type="range" min={1} max={9} value={a} onChange={(e) => setA(+e.target.value)}
            className="h-1 w-16 cursor-pointer appearance-none rounded-full bg-white/20 accent-violet-400" />
        </label>
        <label className="flex items-center gap-1 text-xs text-violet-300">b
          <input type="range" min={1} max={9} value={b} onChange={(e) => setB(+e.target.value)}
            className="h-1 w-16 cursor-pointer appearance-none rounded-full bg-white/20 accent-violet-400" />
        </label>
        <label className="flex items-center gap-1 text-xs text-violet-300">δ°
          <input type="range" min={0} max={360} value={phase} onChange={(e) => setPhase(+e.target.value)}
            className="h-1 w-20 cursor-pointer appearance-none rounded-full bg-white/20 accent-violet-400" />
        </label>
      </div>
    </div>
  );
}


function GearsSlide() {
  const [speed, setSpeed] = useState(1);
  const ref = useRef(speed);
  ref.current = speed;

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const sp = ref.current;
    ctx.clearRect(0, 0, w, h);

    const drawGear = (
      cx: number, cy: number, teeth: number, radius: number, rot: number, color: string,
    ) => {
      const inner = radius * 0.78;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const ang = (i / (teeth * 2)) * Math.PI * 2;
        const r = i % 2 === 0 ? radius : inner;
        const x = r * Math.cos(ang);
        const y = r * Math.sin(ang);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = `${color}33`;
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      // hub
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = `${color}55`;
      ctx.fill();
      ctx.stroke();

      // spokes
      for (let i = 0; i < 4; i++) {
        ctx.save();
        ctx.rotate((i / 4) * Math.PI * 2);
        ctx.beginPath();
        ctx.moveTo(radius * 0.25, 0);
        ctx.lineTo(inner, 0);
        ctx.lineWidth = 4;
        ctx.strokeStyle = `${color}88`;
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    };

    const t1 = 12, t2 = 8;
    const r1 = 70, r2 = (r1 * t2) / t1;
    const cx1 = w * 0.35, cy1 = h / 2;
    const cx2 = cx1 + r1 + r2 - 4;
    const rot1 = t * sp * 0.5;
    const rot2 = -rot1 * (t1 / t2);

    drawGear(cx1, cy1, t1, r1, rot1, '#fb923c');
    drawGear(cx2, cy1, t2, r2, rot2, '#38bdf8');

    // ratio label
    ctx.font = '13px ui-sans-serif, system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(`Gear ratio ${t1}:${t2} = ${(t1 / t2).toFixed(2)}`, 12, 24);
    ctx.fillStyle = '#fb923c';
    ctx.fillText(`ω₁ = ${(sp * 0.5).toFixed(2)} rad/s`, 12, 42);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText(`ω₂ = ${(sp * 0.5 * (t1 / t2)).toFixed(2)} rad/s`, 12, 60);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-3 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <span className="text-xs font-semibold text-orange-300">Drive speed</span>
        <input type="range" min={0} max={4} step={0.1} value={speed}
          onChange={(e) => setSpeed(+e.target.value)}
          className="h-1 w-40 cursor-pointer appearance-none rounded-full bg-white/20 accent-orange-400" />
      </div>
    </div>
  );
}


function CrankSlide() {
  const [rpm, setRpm] = useState(60);
  const ref = useRef(rpm);
  ref.current = rpm;

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const rpm = ref.current;
    const omega = (rpm / 60) * 2 * Math.PI * 0.3; // scaled for visual
    const theta = omega * t;

    const cx = w * 0.25;
    const cy = h / 2;
    const r = Math.min(w, h) * 0.16; // crank radius
    const L = r * 2.6; // connecting rod

    const crankX = cx + r * Math.cos(theta);
    const crankY = cy + r * Math.sin(theta);
    const pistonX = cx + r + L; // approx; exact: r cosθ + √(L² - r²sin²θ)
    const exactX = cx + r * Math.cos(theta) + Math.sqrt(Math.max(0, L * L - r * r * Math.sin(theta) ** 2));
    const pistonY = cy;

    ctx.clearRect(0, 0, w, h);

    // cylinder
    const cylLeft = cx + r;
    const cylRight = w - 20;
    const cylH = r * 1.4;
    ctx.fillStyle = 'rgba(34,211,238,0.08)';
    ctx.fillRect(cylLeft, cy - cylH / 2, cylRight - cylLeft, cylH);
    ctx.strokeStyle = 'rgba(34,211,238,0.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(cylLeft, cy - cylH / 2, cylRight - cylLeft, cylH);

    // crank circle
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

    // crank arm
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(crankX, crankY); ctx.stroke();

    // connecting rod
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(crankX, crankY); ctx.lineTo(exactX, pistonY); ctx.stroke();

    // crank pin
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(crankX, crankY, 5, 0, Math.PI * 2); ctx.fill();

    // piston
    ctx.fillStyle = '#22d3ee';
    ctx.fillRect(exactX - 6, cy - cylH / 2 + 6, 18, cylH - 12);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(exactX - 6, cy - cylH / 2 + 6, 18, cylH - 12);

    // center pivot
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();

    // stroke markers
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(cx + r, cy + cylH / 2 + 14); ctx.lineTo(cx + r, cy + cylH / 2 + 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + r + L, cy + cylH / 2 + 14); ctx.lineTo(cx + r + L, cy + cylH / 2 + 4); ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = '12px ui-sans-serif, system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`Stroke = 2r = ${(2 * r).toFixed(0)}px`, cx, cy + cylH / 2 + 28);
    ctx.fillText(`${rpm} RPM`, 12, 20);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-3 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <span className="text-xs font-semibold text-cyan-300">Engine speed</span>
        <input type="range" min={10} max={300} step={10} value={rpm}
          onChange={(e) => setRpm(+e.target.value)}
          className="h-1 w-40 cursor-pointer appearance-none rounded-full bg-white/20 accent-cyan-400" />
        <span className="w-12 text-xs text-white/70">{rpm} RPM</span>
      </div>
    </div>
  );
}


type Blip = { angle: number; dist: number; life: number };

function RadarSlide() {
  const [speed, setSpeed] = useState(1);
  const ref = useRef(speed);
  ref.current = speed;
  const blipsRef = useRef<Blip[]>([
    { angle: 35, dist: 0.4, life: 0 },
    { angle: 120, dist: 0.7, life: 0 },
    { angle: 210, dist: 0.55, life: 0 },
    { angle: 290, dist: 0.85, life: 0 },
  ]);

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const sp = ref.current;
    const cx = w / 2;
    const cy = h / 2;
    const R = Math.min(w, h) * 0.42;
    const sweep = (t * sp * 0.6) % (Math.PI * 2);
    ctx.clearRect(0, 0, w, h);

    // range rings
    for (let i = 1; i <= 4; i++) {
      ctx.strokeStyle = 'rgba(74,222,128,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, (R * i) / 4, 0, Math.PI * 2); ctx.stroke();
    }
    // cross
    ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy);
    ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();

    // sweep gradient
    const g = ctx.createConicGradient ? ctx.createConicGradient(sweep, cx, cy) : null;
    if (g) {
      g.addColorStop(0, 'rgba(74,222,128,0.5)');
      g.addColorStop(0.05, 'rgba(74,222,128,0.15)');
      g.addColorStop(0.15, 'rgba(74,222,128,0)');
      g.addColorStop(1, 'rgba(74,222,128,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    }
    // sweep line
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * Math.cos(sweep), cy + R * Math.sin(sweep)); ctx.stroke();

    // blips — brighten when sweep passes
    for (const b of blipsRef.current) {
      const ba = (b.angle * Math.PI) / 180;
      const bx = cx + R * b.dist * Math.cos(ba);
      const by = cy + R * b.dist * Math.sin(ba);
      let diff = Math.abs(((sweep - ba) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2));
      if (diff > Math.PI) diff = Math.PI * 2 - diff;
      const bright = Math.max(0, 1 - diff / 0.6);
      b.life = Math.max(b.life * 0.96, bright);

      const alpha = 0.2 + b.life * 0.8;
      ctx.fillStyle = `rgba(74,222,128,${alpha})`;
      ctx.beginPath(); ctx.arc(bx, by, 4 + b.life * 4, 0, Math.PI * 2); ctx.fill();

      if (b.life > 0.3) {
        ctx.fillStyle = `rgba(255,255,255,${b.life * 0.6})`;
        ctx.font = '11px ui-sans-serif, system-ui';
        ctx.fillText(`d=${(b.dist * 100).toFixed(0)}km`, bx + 8, by - 6);
      }
    }

    ctx.font = '12px ui-sans-serif, system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`Azimuth ${(sweep * 180 / Math.PI).toFixed(0)}°`, 12, 20);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-3 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <span className="text-xs font-semibold text-green-300">Sweep speed</span>
        <input type="range" min={0.2} max={3} step={0.1} value={speed}
          onChange={(e) => setSpeed(+e.target.value)}
          className="h-1 w-40 cursor-pointer appearance-none rounded-full bg-white/20 accent-green-400" />
      </div>
    </div>
  );
}


function AntennaSlide() {
  const [elements, setElements] = useState(5);
  const [phase, setPhase] = useState(0);
  const ref = useRef({ elements, phase });
  ref.current = { elements, phase };

  const canvasRef = useCanvasAnimation((ctx, t, w, h) => {
    const { elements: N, phase } = ref.current;
    const cy = h * 0.72;
    const spacing = Math.min(w * 0.06, 40);
    const startX = w / 2 - ((N - 1) * spacing) / 2;
    ctx.clearRect(0, 0, w, h);

    const d = (phase * Math.PI) / 180;
    const freq = 0.04;
    const time = t * 0.8;

    // draw wavefronts from each element
    for (let i = 0; i < N; i++) {
      const ex = startX + i * spacing;
      const elPhase = i * d;
      for (let r = 10; r < w; r += 24) {
        const wave = Math.sin(freq * r - time + elPhase);
        const alpha = Math.max(0, wave) * 0.12 * (1 - r / w);
        ctx.fillStyle = `rgba(248,113,113,${alpha})`;
        ctx.beginPath();
        ctx.arc(ex, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // combined field — sample grid
    const step = 6;
    for (let x = 0; x < w; x += step) {
      for (let y = 0; y < cy; y += step) {
        let sum = 0;
        for (let i = 0; i < N; i++) {
          const ex = startX + i * spacing;
          const dist = Math.hypot(x - ex, y - cy);
          const elPhase = i * d;
          sum += Math.sin(freq * dist * 4 - time + elPhase) / Math.max(1, dist * 0.06);
        }
        const v = sum / N;
        const a = Math.min(1, Math.abs(v) * 0.5);
        if (v > 0) ctx.fillStyle = `rgba(248,113,113,${a})`;
        else ctx.fillStyle = `rgba(56,189,248,${a})`;
        ctx.fillRect(x, y, step, step);
      }
    }

    // antenna elements
    for (let i = 0; i < N; i++) {
      const ex = startX + i * spacing;
      ctx.fillStyle = '#fff';
      ctx.fillRect(ex - 2, cy - 18, 4, 18);
      ctx.beginPath(); ctx.arc(ex, cy, 4, 0, Math.PI * 2); ctx.fill();
    }

    // ground line
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();

    ctx.font = '12px ui-sans-serif, system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(`${N} elements, phase ${phase}°`, 12, 20);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-4 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <label className="flex items-center gap-2 text-xs text-red-300">Elements
          <input type="range" min={1} max={9} value={elements}
            onChange={(e) => setElements(+e.target.value)}
            className="h-1 w-24 cursor-pointer appearance-none rounded-full bg-white/20 accent-red-400" />
        </label>
        <label className="flex items-center gap-2 text-xs text-red-300">Phase
          <input type="range" min={0} max={180} value={phase}
            onChange={(e) => setPhase(+e.target.value)}
            className="h-1 w-24 cursor-pointer appearance-none rounded-full bg-white/20 accent-red-400" />
        </label>
      </div>
    </div>
  );
}


function SolarSlide() {
  const [hour, setHour] = useState(12);
  const [lat, setLat] = useState(35);
  const ref = useRef({ hour, lat });
  ref.current = { hour, lat };

  const canvasRef = useCanvasAnimation((ctx, _t, w, h) => {
    const { hour, lat } = ref.current;
    ctx.clearRect(0, 0, w, h);

    const groundY = h * 0.72;
    const panelCx = w / 2;
    const panelCy = groundY;
    const panelLen = Math.min(w, h) * 0.18;

    // sun angle from hour (6am–6pm mapped to 0–180°)
    const sunAngle = ((hour - 6) / 12) * Math.PI; // 0..π
    const sunR = Math.min(w, h) * 0.38;
    const sunX = panelCx - Math.cos(sunAngle) * sunR;
    const sunY = panelCy - Math.sin(sunAngle) * sunR;

    // sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, groundY);
    const elev = Math.sin(sunAngle);
    sky.addColorStop(0, `rgba(15,23,42,${1 - elev * 0.4})`);
    sky.addColorStop(1, `rgba(250,204,21,${elev * 0.15})`);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, groundY);

    // ground
    ctx.fillStyle = 'rgba(34,197,94,0.12)';
    ctx.fillRect(0, groundY, w, h - groundY);
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

    // sun
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 40);
    sunGrad.addColorStop(0, '#fde047');
    sunGrad.addColorStop(0.5, '#facc15');
    sunGrad.addColorStop(1, 'rgba(250,204,21,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath(); ctx.arc(sunX, sunY, 40, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(sunX, sunY, 14, 0, Math.PI * 2); ctx.fill();

    // sun elevation angle (latitude-adjusted simplification)
    const declination = 23.45 * Math.sin(((360 / 365) * (hour - 81) * Math.PI) / 180);
    const latRad = (lat * Math.PI) / 180;
    const hourAngle = (15 * (hour - 12) * Math.PI) / 180;
    const elevation = Math.asin(
      Math.sin(latRad) * Math.sin((declination * Math.PI) / 180) +
      Math.cos(latRad) * Math.cos((declination * Math.PI) / 180) * Math.cos(hourAngle),
    );
    const tilt = elevation; // panel tracks sun elevation

    // panel
    ctx.save();
    ctx.translate(panelCx, panelCy);
    ctx.rotate(-tilt);
    const panelGrad = ctx.createLinearGradient(0, -panelLen * 0.4, 0, 0);
    panelGrad.addColorStop(0, '#1e3a8a');
    panelGrad.addColorStop(1, '#1e40af');
    ctx.fillStyle = panelGrad;
    ctx.fillRect(-panelLen / 2, -panelLen * 0.4, panelLen, panelLen * 0.4);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-panelLen / 2, -panelLen * 0.4, panelLen, panelLen * 0.4);
    // grid cells
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-panelLen / 2 + (panelLen * i) / 4, -panelLen * 0.4);
      ctx.lineTo(-panelLen / 2 + (panelLen * i) / 4, 0);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-panelLen / 2, -panelLen * 0.2);
    ctx.lineTo(panelLen / 2, -panelLen * 0.2);
    ctx.stroke();
    // post
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(-3, 0, 6, 20);
    ctx.restore();

    // sun ray to panel
    ctx.strokeStyle = `rgba(250,204,21,${Math.max(0, Math.sin(sunAngle)) * 0.6})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(sunX, sunY); ctx.lineTo(panelCx, panelCy - panelLen * 0.2); ctx.stroke();
    ctx.setLineDash([]);

    // readout
    const efficiency = Math.max(0, Math.sin(sunAngle)) * 100;
    ctx.font = '12px ui-sans-serif, system-ui';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`Sun elevation: ${(elevation * 180 / Math.PI).toFixed(1)}°`, 12, 20);
    ctx.fillStyle = '#facc15';
    ctx.fillText(`Panel tilt: ${(tilt * 180 / Math.PI).toFixed(1)}°`, 12, 38);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`Incident irradiance: ${efficiency.toFixed(0)}%`, 12, 56);
  });

  return (
    <div className="relative h-full w-full">
      <canvas ref={canvasRef} className="h-full w-full" />
      <div className="absolute bottom-4 left-1/2 flex -translate-x-1/2 items-center gap-4 rounded-full border border-white/10 bg-black/30 px-4 py-2 backdrop-blur-md">
        <label className="flex items-center gap-2 text-xs text-yellow-300">Hour
          <input type="range" min={6} max={18} step={0.5} value={hour}
            onChange={(e) => setHour(+e.target.value)}
            className="h-1 w-24 cursor-pointer appearance-none rounded-full bg-white/20 accent-yellow-400" />
          <span className="w-10">{hour}:00</span>
        </label>
        <label className="flex items-center gap-2 text-xs text-yellow-300">Lat
          <input type="range" min={-60} max={70} value={lat}
            onChange={(e) => setLat(+e.target.value)}
            className="h-1 w-20 cursor-pointer appearance-none rounded-full bg-white/20 accent-yellow-400" />
          <span className="w-10">{lat}°</span>
        </label>
      </div>
    </div>
  );
}


const slideComponents: Record<string, React.ComponentType> = {

function AppContent() {
  const { theme, toggle: toggleTheme } = useTheme();
  const [lang, setLang] = useState<Lang>('en');
  const [view, setView] = useState<'landing' | 'slides'>('landing');
  const [index, setIndex] = useState(0);
  const [direction, setDirection] = useState(1);
  const [dropdownOpen, setDropdownOpen] = useState(false);
  const [langOpen, setLangOpen] = useState(false);
  const dropdownRef = useRef<HTMLDivElement>(null);
  const langRef = useRef<HTMLDivElement>(null);

  const t = translations[lang];
  const total = slides.length;
  const meta = slides[index];
  const slideT = t.slides[meta.id];
  const SlideComponent = slideComponents[meta.id];

  const isDark = theme === 'dark';
  const textMain = isDark ? 'text-white' : 'text-slate-900';
  const textSub = isDark ? 'text-white/40' : 'text-slate-500';
  const headerBorder = isDark ? 'border-white/10' : 'border-black/10';
  const headerBg = isDark ? 'bg-white/5' : 'bg-white/40';
  const footerBg = isDark ? 'bg-black/40' : 'bg-white/50';
  const footerBorder = isDark ? 'border-white/10' : 'border-black/10';
  const navBtn = isDark
    ? 'border-white/10 bg-white/5 text-white/70 hover:bg-white/10 hover:text-white'
    : 'border-black/10 bg-white/40 text-slate-600 hover:bg-white/60 hover:text-slate-900';
  const dotIdle = isDark ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.2)';
  const tooltipBg = isDark ? 'bg-black/80 text-white/70' : 'bg-white/90 text-slate-700';
  const tooltipBorder = isDark ? 'border-white/10' : 'border-black/10';

  const go = useCallback((dir: number) => {
    setDirection(dir);
    setIndex((i) => (i + dir + total) % total);
  }, [total]);

  const goTo = useCallback((i: number) => {
    setDirection(i > index ? 1 : -1);
    setIndex(i);
    setDropdownOpen(false);
  }, [index]);

  const enterSlides = useCallback(() => {
    setView('slides');
    setIndex(0);
  }, []);

  const goLanding = useCallback(() => {
    setView('landing');
  }, []);

  useEffect(() => {
    const onKey = (e: KeyboardEvent) => {
      if (view !== 'slides') return;
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [go, view]);

  // Close dropdowns on outside click
  useEffect(() => {
    const onClick = (e: MouseEvent) => {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target as Node)) {
        setDropdownOpen(false);
      }
      if (langRef.current && !langRef.current.contains(e.target as Node)) {
        setLangOpen(false);
      }
    };
    window.addEventListener('mousedown', onClick);
    return () => window.removeEventListener('mousedown', onClick);
  }, []);

  if (view === 'landing') {
    return (
      <div className={`relative min-h-screen ${textMain}`}>
        <AnimatedBackground />
        <IdleBackground />
        <CursorTracer />

        {/* Top bar */}
        <header className="relative z-20 flex items-center justify-between px-6 py-5 sm:px-10">
          <div className="flex items-center gap-3">
            <div className={`flex h-10 w-10 items-center justify-center rounded-xl border ${headerBorder} ${headerBg} backdrop-blur-md`}>
              <Compass className="h-5 w-5 text-cyan-400" />
            </div>
            <div>
              <h1 className={`font-display text-sm font-bold tracking-wide ${textMain} sm:text-base`}>
                {lang === 'en' ? 'Trigonometry in Motion' : 'गति में त्रिकोणमिति'}
              </h1>
              <p className={`text-[11px] ${textSub}`}>
                {lang === 'en' ? 'The mathematics behind real machines' : 'वास्तविक मशीनों के पीछे का गणित'}
              </p>
            </div>
          </div>

          <div className="flex items-center gap-3">
            {/* Language toggle */}
            <div ref={langRef} className="relative">
              <button
                onClick={() => setLangOpen(!langOpen)}
                className={`flex items-center gap-1.5 rounded-full border ${headerBorder} ${headerBg} px-3 py-2 text-xs font-medium backdrop-blur-md transition hover:opacity-80`}
              >
                <Globe className="h-4 w-4 text-cyan-400" />
                <span className={textMain}>{lang === 'en' ? 'EN' : 'हि'}</span>
                <ChevronDown className={`h-3 w-3 ${textSub} transition-transform ${langOpen ? 'rotate-180' : ''}`} />
              </button>
              {langOpen && (
                <div
                  className={`dropdown-fade absolute right-0 mt-2 w-36 overflow-hidden rounded-2xl border ${headerBorder} ${isDark ? 'bg-[#0a0e1a]/80' : 'bg-white/80'} shadow-2xl backdrop-blur-2xl`}
                >
                  {(['en', 'hi'] as Lang[]).map((l) => (
                    <button
                      key={l}
                      onClick={() => { setLang(l); setLangOpen(false); }}
                      className={`dropdown-item flex w-full items-center gap-2 px-3 py-2.5 text-xs transition-all duration-200 hover:scale-[1.03] ${lang === l ? `${isDark ? 'bg-cyan-400/10' : 'bg-cyan-400/10'} font-semibold` : isDark ? 'hover:bg-white/5' : 'hover:bg-black/5'} ${textMain}`}
                      style={{ animationDelay: `${l === 'en' ? '0s' : '0.05s'}` }}
                    >
                      <Globe className="h-3.5 w-3.5 text-cyan-400" />
                      {l === 'en' ? 'English' : 'हिंदी'}
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* Theme toggle */}
            <button
              onClick={toggleTheme}
              className={`flex h-10 w-10 items-center justify-center rounded-full border ${headerBorder} ${headerBg} backdrop-blur-md transition hover:opacity-80`}
              aria-label="Toggle theme"
            >
              {isDark ? <Sun className="h-5 w-5 text-amber-300" /> : <Moon className="h-5 w-5 text-indigo-500" />}
            </button>
          </div>
        </header>

        <LandingPage t={t} lang={lang} onEnter={enterSlides} />

        {/* Footer */}
        <footer className={`relative z-20 border-t ${footerBorder} px-6 py-4 text-center`}>
          <p className={`text-sm font-medium ${textSub}`}>
            {t.footer.madeBy}
          </p>
        </footer>
      </div>
    );
  }

  return (
    <div className={`relative flex min-h-screen flex-col ${textMain}`}>
      <AnimatedBackground />
      <IdleBackground />
      <CursorTracer />

      {/* Header */}
      <header className="relative z-10 flex items-center justify-between px-6 py-5 sm:px-10">
        <div className="flex items-center gap-3">
          <button
            onClick={goLanding}
            className={`flex h-10 w-10 items-center justify-center rounded-xl border ${headerBorder} ${headerBg} backdrop-blur-md transition hover:opacity-80`}
            aria-label="Home"
          >
            <Home className="h-5 w-5 text-cyan-400" />
          </button>
          <div>
            <h1 className={`font-display text-sm font-bold tracking-wide ${textMain} sm:text-base`}>
              {lang === 'en' ? 'Trigonometry in Motion' : 'गति में त्रिकोणमिति'}
            </h1>
            <p className={`text-[11px] ${textSub}`}>
              {lang === 'en' ? 'The mathematics behind real machines' : 'वास्तविक मशीनों के पीछे का गणित'}
            </p>
          </div>
        </div>

        <div className="flex items-center gap-3">
          {/* Dropdown slide navigator */}
          <div ref={dropdownRef} className="relative">
            <button
              onClick={() => setDropdownOpen(!dropdownOpen)}
              className={`flex items-center gap-2 rounded-full border ${headerBorder} ${headerBg} px-4 py-2 text-xs font-medium backdrop-blur-md transition hover:opacity-80`}
            >
              <LayoutGrid className="h-4 w-4 text-cyan-400" />
              <span className={`hidden sm:inline ${textMain}`}>{slideT.title}</span>
              <span className={`sm:hidden ${textMain}`}>{index + 1}/{total}</span>
              <ChevronDown className={`h-3 w-3 ${textSub} transition-transform ${dropdownOpen ? 'rotate-180' : ''}`} />
            </button>
            {dropdownOpen && (
              <div
                className={`dropdown-fade absolute right-0 mt-2 w-72 max-h-[60vh] overflow-y-auto rounded-2xl border ${headerBorder} ${isDark ? 'bg-[#0a0e1a]/80' : 'bg-white/80'} shadow-2xl backdrop-blur-2xl`}
                style={{ boxShadow: isDark ? '0 12px 48px -8px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05)' : '0 12px 48px -8px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.4)' }}
              >
                {slides.map((s, i) => (
                  <button
                    key={s.id}
                    onClick={() => goTo(i)}
                    className={`dropdown-item group flex w-full items-start gap-3 rounded-xl px-3 py-2.5 text-left transition-all duration-200 ${i === index ? (isDark ? 'bg-white/5' : 'bg-black/5') : isDark ? 'hover:bg-white/5' : 'hover:bg-black/5'} hover:scale-[1.03] hover:shadow-lg`}
                    style={{ animationDelay: `${i * 0.03}s` }}
                  >
                    <span
                      className="mt-0.5 flex h-7 w-7 flex-shrink-0 items-center justify-center rounded-lg text-[10px] font-bold transition-transform duration-200 group-hover:scale-110"
                      style={{ background: `${s.accent}22`, color: s.accent, border: `1px solid ${s.accent}44` }}
                    >
                      {i + 1}
                    </span>
                    <div className="min-w-0 flex-1">
                      <div className={`truncate text-xs font-semibold ${textMain} transition-transform duration-200 group-hover:translate-x-0.5`}>{t.slides[s.id].title}</div>
                      <div className={`truncate text-[10px] ${textSub}`}>{t.slides[s.id].category}</div>
                    </div>
                    {i === index && (
                      <span className="mt-1.5 h-2 w-2 flex-shrink-0 rounded-full" style={{ background: s.accent }} />
                    )}
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Language toggle */}
          <div ref={langRef} className="relative">
            <button
              onClick={() => setLangOpen(!langOpen)}
              className={`flex items-center gap-1.5 rounded-full border ${headerBorder} ${headerBg} px-3 py-2 text-xs font-medium backdrop-blur-md transition hover:opacity-80`}
            >
              <Globe className="h-4 w-4 text-cyan-400" />
              <span className={textMain}>{lang === 'en' ? 'EN' : 'हि'}</span>
              <ChevronDown className={`h-3 w-3 ${textSub} transition-transform ${langOpen ? 'rotate-180' : ''}`} />
            </button>
            {langOpen && (
              <div
                className={`dropdown-fade absolute right-0 mt-2 w-36 overflow-hidden rounded-2xl border ${headerBorder} ${isDark ? 'bg-[#0a0e1a]/80' : 'bg-white/80'} shadow-2xl backdrop-blur-2xl`}
              >
                {(['en', 'hi'] as Lang[]).map((l) => (
                  <button
                    key={l}
                    onClick={() => { setLang(l); setLangOpen(false); }}
                    className={`dropdown-item flex w-full items-center gap-2 px-3 py-2.5 text-xs transition-all duration-200 hover:scale-[1.03] ${lang === l ? `${isDark ? 'bg-cyan-400/10' : 'bg-cyan-400/10'} font-semibold` : isDark ? 'hover:bg-white/5' : 'hover:bg-black/5'} ${textMain}`}
                    style={{ animationDelay: `${l === 'en' ? '0s' : '0.05s'}` }}
                  >
                    <Globe className="h-3.5 w-3.5 text-cyan-400" />
                    {l === 'en' ? 'English' : 'हिंदी'}
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Theme toggle */}
          <button
            onClick={toggleTheme}
            className={`flex h-10 w-10 items-center justify-center rounded-full border ${headerBorder} ${headerBg} backdrop-blur-md transition hover:opacity-80`}
            aria-label="Toggle theme"
          >
            {isDark ? <Sun className="h-5 w-5 text-amber-300" /> : <Moon className="h-5 w-5 text-indigo-500" />}
          </button>
        </div>
      </header>

      {/* Slide area */}
      <main className="relative z-10 flex-1 px-6 pb-28 sm:px-10">
        <div
          key={meta.id}
          className="mx-auto h-full max-w-7xl animate-[slidein_0.5s_ease-out]"
          style={{ animationName: 'slidein' }}
        >
          <SlideShell
            index={index}
            total={total}
            title={slideT.title}
            subtitle={slideT.subtitle}
            category={slideT.category}
            accent={meta.accent}
            facts={slideT.facts}
            realLife={slideT.realLife}
            realLifeLabel={lang === 'en' ? 'Where It\u2019s Used in Real Life' : 'वास्तविक जीवन में उपयोग'}
            visual={<SlideComponent />}
          >
            {slideT.description}
          </SlideShell>
        </div>
      </main>

      {/* Footer nav */}
      <footer className="fixed inset-x-0 bottom-0 z-20 px-6 pb-5">
        <div className={`mx-auto flex max-w-7xl items-center justify-between gap-4 rounded-2xl border ${footerBorder} ${footerBg} px-4 py-3 backdrop-blur-xl`}>
          <button
            onClick={() => go(-1)}
            className={`flex h-10 w-10 items-center justify-center rounded-full border ${navBtn} transition`}
            aria-label={t.nav.prev}
          >
            <ChevronLeft className="h-5 w-5" />
          </button>

          {/* dots */}
          <div className="flex flex-1 items-center justify-center gap-2 overflow-x-auto">
            {slides.map((s, i) => (
              <button
                key={s.id}
                onClick={() => goTo(i)}
                className="group relative flex flex-col items-center"
                aria-label={`Go to ${t.slides[s.id].title}`}
              >
                <span
                  className="h-2 rounded-full transition-all duration-300"
                  style={{
                    width: i === index ? 28 : 8,
                    background: i === index ? s.accent : dotIdle,
                  }}
                />
                <span className={`pointer-events-none absolute -top-9 whitespace-nowrap rounded-md border ${tooltipBorder} ${tooltipBg} px-2 py-1 text-[10px] opacity-0 transition-opacity duration-200 group-hover:opacity-100`}>
                  {t.slides[s.id].title}
                </span>
              </button>
            ))}
          </div>

          <button
            onClick={() => go(1)}
            className={`flex h-10 w-10 items-center justify-center rounded-full border ${navBtn} transition`}
            aria-label={t.nav.next}
          >
            <ChevronRight className="h-5 w-5" />
          </button>
        </div>
        {/* Made by Aishik */}
        <div className="mt-2 text-center">
          <span className={`text-xs font-medium ${textSub}`}>
            {t.footer.madeBy}
          </span>
        </div>
      </footer>

      <style>{`
        @keyframes slidein {
          from { opacity: 0; transform: translateY(12px) scale(0.99); }
          to   { opacity: 1; transform: translateY(0) scale(1); }
        }
      `}</style>
    </div>
  );
}

function App() {
  return (
    <ThemeProvider>
      <AppContent />
    </ThemeProvider>
  );
}


// Mount the application.
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
